<style>
    form {
        display: flex;
        flex-direction: column;
        width: 300px;
        margin: 0 auto;
    }
    input, button {
        margin-bottom: 1rem;
        padding: 0.5rem;
        font-size: 1rem;
    }
    button {
        background-color: #007bff;
        color: white;
        border: none;
        cursor: pointer;
    }
    #remember {
        display: flex;
        align-items: center;
        margin-bottom: 1rem;
    }
    #remember label {
        margin-left: 0.5rem;
    }

        background-color: #0056b3;
    }

<form action="" method="post">
    <h3>Login Test</h3>
    <label for="email">Email:</label>
